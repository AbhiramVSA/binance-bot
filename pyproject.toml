[project]
name = "binance-bot"
version = "0.1.0"
description = "Simplified Binance Futures Trading Bot for Testnet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
binance-bot = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
